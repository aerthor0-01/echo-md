[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "echoctl"
version = "0.1.0"
description = "Local change journal for AI agent files. Keep the history on disk, not in the prompt."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
echoctl = "echoctl.cli:main"
